name: Deploy MRecipes to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import licensed public-domain recipe photography
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import-public-domain-recipe-photos.py
      - name: Commit imported photos and local image references
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add public-domain recipe photos and local references [skip ci]"
            git push origin HEAD:main
          else
            echo "No photo assets or local references to commit."
          fi
      - name: Build SEO metadata, hreflang, TOC and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo-build-v2.py
          python3 scripts/seo-description-fix.py
          python3 scripts/validate-i18n.py
      - name: Add Imad Limrani author attribution beneath page summaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-author-attribution.py
      - name: Audit localized article completeness (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-i18n-content.py > /tmp/i18n-content-audit.md
          sed -n '/## Summary/,$p' /tmp/i18n-content-audit.md
      - name: Generate responsive WebP images and JPEG fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/mrecipes-image-venv
          /tmp/mrecipes-image-venv/bin/pip install --disable-pip-version-check Pillow
          /tmp/mrecipes-image-venv/bin/python scripts/optimize-responsive-images.py
      - name: Validate shared JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/components/header.js
          node --check assets/js/components/footer.js
          node --check assets/js/main.js
      - name: Validate site structure, SEO and local links
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "mrecipes.online"
          test -f index.html && test -f recipes.html
          test -f assets/css/main.css && test -f assets/css/mobile-nav.css && test -f assets/css/seo-enhancements.css
          test -f assets/js/components/header.js && test -f assets/js/components/footer.js && test -f assets/js/main.js
          test -f recipes/recipe-template.html && test -f sitemap.xml && test -f robots.txt
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys, xml.etree.ElementTree as ET
          root=Path('.'); errors=[]; html_files=sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.title=''; self.on=False; self.buf=[]; self.meta={}; self.canon=[]; self.links=[]; self.schema=False
              def handle_starttag(self,t,a):
                  d=dict(a); rel=d.get('rel','').lower()
                  if t=='title': self.on=True; self.buf=[]
                  if t=='meta' and d.get('name','').lower() in ('description','robots','keywords'): self.meta[d.get('name','').lower()]=d.get('content','') or ''
                  if t=='link' and rel=='canonical': self.canon.append(d.get('href',''))
                  if t=='script' and d.get('type')=='application/ld+json': self.schema=True
                  if t=='a' and d.get('href'): self.links.append(d['href'])
                  if t in ('script','link'):
                      key='src' if t=='script' else 'href'
                      if d.get(key): self.links.append(d[key])
              def handle_endtag(self,t):
                  if t=='title': self.title=''.join(self.buf).strip(); self.on=False
              def handle_data(self,d):
                  if self.on:self.buf.append(d)
          for page in html_files:
              if page.name=='404.html': continue
              p=P(); p.feed(page.read_text(encoding='utf-8')); label=str(page)
              if not p.title: errors.append(f'{label}: missing title')
              if not 50 <= len(p.meta.get('description','')) <= 160: errors.append(f'{label}: meta description must be 50-160 characters')
              robots=p.meta.get('robots','').lower()
              if 'noindex' in robots or 'nofollow' in robots or 'index' not in robots or 'follow' not in robots: errors.append(f'{label}: robots must allow index,follow')
              if len(p.canon)!=1 or not p.canon[0].startswith('https://mrecipes.online/'): errors.append(f'{label}: invalid canonical')
              if page.parent.name=='recipes' and page.name not in ('recipe-template.html','index.html') and not p.schema: errors.append(f'{label}: missing JSON-LD Recipe schema')
              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' in page.read_text(encoding='utf-8'):
                  errors.append(f'{label}: AdSense loader must be consent-gated, not embedded in HTML')
              for href in p.links:
                  if href.startswith(('#','mailto:','tel:','javascript:','data:','http://','https://','//')): continue
                  clean=urlparse(href).path; target=root/clean.lstrip('/') if clean.startswith('/') else (page.parent/clean).resolve()
                  if target.is_dir(): target=target/'index.html'
                  if not target.is_file(): errors.append(f'{label}: broken local link/asset {href}')
          try:
              tree=ET.parse(root/'sitemap.xml'); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}; urls=[]
              for loc in tree.findall('.//s:loc',ns):
                  u=urlparse((loc.text or '').strip())
                  if u.scheme!='https' or u.netloc!='mrecipes.online': errors.append(f'sitemap: invalid URL {loc.text}')
                  urls.append(u.path)
              if len(urls)!=len(set(urls)): errors.append('sitemap: duplicate URLs')
              # Require every eligible HTML page to be represented in the sitemap, and
              # reject sitemap entries that do not map to a real HTML page.
              def page_url_path(page):
                  rel=page.as_posix()
                  if rel=='index.html': return '/'
                  if rel.endswith('/index.html'): return '/'+rel[:-10].strip('/')+'/'
                  return '/'+rel
              expected={page_url_path(p) for p in html_files if p.name!='404.html' and p.as_posix()!='recipes/recipe-template.html'}
              actual=set(urls)
              for missing in sorted(expected-actual): errors.append(f'sitemap: missing eligible HTML page {missing}')
              for extra in sorted(actual-expected): errors.append(f'sitemap: URL has no eligible HTML page {extra}')
          except Exception as exc: errors.append(f'sitemap parse error: {exc}')
          if errors: print('\n'.join('ERROR: '+e for e in errors)); sys.exit(1)
          print(f'Validation passed: {len(html_files)} HTML files, metadata, robots, canonical, JSON-LD, consent-gated advertising, local links and sitemap.')
          PY
      - name: Persist generated sitemap on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update generated sitemap [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated sitemap is already up to date."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-youtube-search-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_YOUTUBE_SEARCH_WORKER == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "Missing YOUTUBE_API_KEY secret"; exit 1; }
      - name: Create temporary Worker deployment source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mrecipes-youtube-worker
          cat > /tmp/mrecipes-youtube-worker/index.js <<WORKER
          const ALLOWED_ORIGINS = new Set(["https://mrecipes.online", "https://www.mrecipes.online"]);
          const LANGUAGES = new Set(["en", "ar", "es", "fr", "ru"]);
          const REGIONS = new Set(["US", "MA", "ES", "FR", "RU"]);
          function json(data, status, origin) {
            const headers = { "Content-Type": "application/json; charset=utf-8", "Cache-Control": "public, max-age=300", "Vary": "Origin", "Access-Control-Allow-Methods": "GET, OPTIONS", "Access-Control-Allow-Headers": "Accept" };
            if (origin && ALLOWED_ORIGINS.has(origin)) headers["Access-Control-Allow-Origin"] = origin;
            return new Response(JSON.stringify(data), { status: status || 200, headers });
          }
          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              const origin = request.headers.get("Origin") || "";
              if (origin && !ALLOWED_ORIGINS.has(origin)) return json({ error: "Origin not allowed" }, 403, "");
              if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: { "Access-Control-Allow-Origin": origin || "https://mrecipes.online", "Access-Control-Allow-Methods": "GET, OPTIONS", "Access-Control-Allow-Headers": "Accept", "Access-Control-Max-Age": "86400", "Vary": "Origin" } });
              if (request.method !== "GET") return json({ error: "Method not allowed" }, 405, origin);
              if (url.pathname !== "/api/youtube-search") return json({ error: "Not found" }, 404, origin);
              if (url.searchParams.get("health") === "1") return json({ ok: true, service: "mrecipes-youtube-search" }, 200, origin);
              const query = (url.searchParams.get("q") || "").trim();
              if (query.length < 2 || query.length > 100) return json({ error: "Search query must be between 2 and 100 characters." }, 400, origin);
              if (!env.YOUTUBE_API_KEY) return json({ error: "Search service is not configured." }, 503, origin);
              const langValue = (url.searchParams.get("lang") || "en").toLowerCase();
              const regionValue = (url.searchParams.get("region") || "US").toUpperCase();
              const lang = LANGUAGES.has(langValue) ? langValue : "en";
              const region = REGIONS.has(regionValue) ? regionValue : "US";
              const pageToken = url.searchParams.get("pageToken") || "";
              if (pageToken.length > 512 || !/^[A-Za-z0-9_=-]*$/.test(pageToken)) return json({ error: "Invalid pagination token." }, 400, origin);
              const cacheUrl = new URL(url.origin + url.pathname);
              cacheUrl.searchParams.set("q", query.toLowerCase()); cacheUrl.searchParams.set("lang", lang); cacheUrl.searchParams.set("region", region);
              if (pageToken) cacheUrl.searchParams.set("pageToken", pageToken);
              cacheUrl.searchParams.set("__origin", origin || "same-origin");
              const cacheKey = new Request(cacheUrl.toString(), { method: "GET" });
              const cache = caches.default; const cached = await cache.match(cacheKey);
              if (cached) return cached;
              const apiUrl = new URL("https://www.googleapis.com/youtube/v3/search");
              apiUrl.searchParams.set("part", "snippet"); apiUrl.searchParams.set("type", "video"); apiUrl.searchParams.set("q", query);
              apiUrl.searchParams.set("maxResults", "12"); apiUrl.searchParams.set("order", "relevance"); apiUrl.searchParams.set("safeSearch", "strict");
              apiUrl.searchParams.set("videoEmbeddable", "true"); apiUrl.searchParams.set("videoSyndicated", "true");
              apiUrl.searchParams.set("relevanceLanguage", lang); apiUrl.searchParams.set("regionCode", region); apiUrl.searchParams.set("key", env.YOUTUBE_API_KEY);
              if (pageToken) apiUrl.searchParams.set("pageToken", pageToken);
              try {
                const upstream = await fetch(apiUrl.toString(), { headers: { "Accept": "application/json" } });
                if (!upstream.ok) { const status = upstream.status === 403 ? 429 : 502; return json({ error: status === 429 ? "YouTube search quota or API permission limit reached." : "YouTube search is temporarily unavailable." }, status, origin); }
                const payload = await upstream.json();
                const items = (payload.items || []).map((item) => {
                  const videoId = item.id && item.id.videoId; const snippet = item.snippet || {};
                  if (!videoId || !/^[A-Za-z0-9_-]{11}$/.test(videoId)) return null;
                  const thumbnails = snippet.thumbnails || {}; const thumbnail = (thumbnails.high || thumbnails.medium || thumbnails.default || {}).url || "";
                  return { videoId, title: String(snippet.title || "Untitled video").slice(0, 250), description: String(snippet.description || "").slice(0, 500), channelTitle: String(snippet.channelTitle || "").slice(0, 120), publishedAt: snippet.publishedAt || "", thumbnail };
                }).filter(Boolean);
                const response = json({ items, nextPageToken: payload.nextPageToken || "" }, 200, origin);
                response.headers.set("Cache-Control", "public, max-age=300"); ctx.waitUntil(cache.put(cacheKey, response.clone())); return response;
              } catch (error) { return json({ error: "YouTube search is temporarily unavailable." }, 502, origin); }
            }
          }
          WORKER
          cat > /tmp/mrecipes-youtube-worker/wrangler.jsonc <<CONFIG
          {
            "name": "mrecipes-youtube-search",
            "main": "index.js",
            "compatibility_date": "2026-11-02",
            "workers_dev": false,
            "routes": [{ "pattern": "mrecipes.online/api/youtube-search*", "zone_name": "mrecipes.online" }]
          }
          CONFIG
      - name: Deploy YouTube search Worker
        shell: bash
        run: npx --yes wrangler@4 deploy --config /tmp/mrecipes-youtube-worker/wrangler.jsonc
      - name: Store YouTube API key as a Worker runtime secret
        shell: bash
        run: printf '%s' "$YOUTUBE_API_KEY" | npx --yes wrangler@4 secret put YOUTUBE_API_KEY --name mrecipes-youtube-search --config /tmp/mrecipes-youtube-worker/wrangler.jsonc
      - name: Verify Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://mrecipes.online/api/youtube-search?health=1"; then exit 0; fi
            sleep 5
          done
          echo "Worker health check failed."
          exit 1
