name: Deploy MRecipes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site structure and SEO basics
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "mrecipes.online"
          test -f index.html
          test -f recipes.html
          test -f assets/css/style.css
          test -f assets/js/header.js
          test -f assets/js/footer.js
          test -f assets/js/main.js
          test -f sitemap.xml
          test -f robots.txt

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = Path(".")
          errors = []
          html_files = sorted(root.glob("*.html")) + sorted((root / "recipes").glob("*.html"))

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title = False
                  self.title_text = []
                  self.meta = {}
                  self.canonical = []
                  self.recipe_schema = False
                  self.links = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "title":
                      self.title = True
                  if tag == "meta" and a.get("name", "").lower() in ("description",):
                      self.meta[a["name"].lower()] = a.get("content", "").strip()
                  if tag == "link" and a.get("rel", "").lower() == "canonical":
                      self.canonical.append(a.get("href", ""))
                  if tag == "script":
                      if a.get("type") == "application/ld+json":
                          self.recipe_schema = True
                      if a.get("src"):
                          self.scripts.append(a["src"])
                  if tag == "link" and a.get("rel", "").lower() == "stylesheet":
                      if a.get("href"):
                          self.styles.append(a["href"])
                  if tag in ("a", "img", "script", "link"):
                      key = {"a": "href", "img": "src", "script": "src", "link": "href"}[tag]
                      if a.get(key):
                          self.links.append(a[key])
              def handle_endtag(self, tag):
                  if tag == "title":
                      self.title = False
              def handle_data(self, data):
                  if self.title:
                      self.title_text.append(data)

          if not html_files:
              errors.append("No HTML pages found.")
          for page in html_files:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              label = str(page)
              title = "".join(parser.title_text).strip()
              if not title:
                  errors.append(f"{label}: missing title.")
              if len(parser.meta.get("description", "")) < 50:
                  errors.append(f"{label}: missing or too-short meta description (minimum 50 characters).")
              if len(parser.canonical) != 1 or not parser.canonical[0].startswith("https://mrecipes.online/"):
                  errors.append(f"{label}: expected exactly one canonical URL on https://mrecipes.online/.")
              if page.parent.name == "recipes" and not parser.recipe_schema:
                  errors.append(f"{label}: missing JSON-LD structured data.")

              for asset in parser.scripts + parser.styles:
                  if asset.startswith(("http://", "https://", "//", "data:")):
                      continue
                  path = asset.split("?", 1)[0].split("#", 1)[0]
                  if path.startswith("/"):
                      target = root / path.lstrip("/")
                  else:
                      target = page.parent / path
                  if path and not target.is_file():
                      errors.append(f"{label}: local asset not found: {asset}")

          try:
              sitemap = ET.parse(root / "sitemap.xml")
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              for loc in sitemap.findall(".//sm:loc", ns):
                  url = (loc.text or "").strip()
                  if not url.startswith("https://mrecipes.online/"):
                      errors.append(f"sitemap.xml: URL outside canonical domain: {url}")
                  else:
                      path = url.removeprefix("https://mrecipes.online/")
                      target = root / path if path else root / "index.html"
                      if not target.is_file():
                          errors.append(f"sitemap.xml: URL points to missing file: {url}")
          except Exception as exc:
              errors.append(f"Could not parse sitemap.xml: {exc}")

          if errors:
              print("\n".join(f"ERROR: {item}" for item in errors))
              sys.exit(1)
          print(f"Validation passed: {len(html_files)} HTML pages, metadata, recipe schema, local assets, and sitemap.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
