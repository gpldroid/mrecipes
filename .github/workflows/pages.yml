name: Deploy MRecipes to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SEO metadata, hreflang, TOC and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seo-build.py
          python3 scripts/add-seo-css.py

      - name: Validate site structure, SEO and local links
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "mrecipes.online"
          test -f index.html
          test -f recipes.html
          test -f assets/css/main.css
          test -f assets/css/mobile-nav.css
          test -f assets/css/seo-enhancements.css
          test -f assets/js/components/header.js
          test -f assets/js/components/footer.js
          test -f assets/js/main.js
          test -f recipes/recipe-template.html
          test -f sitemap.xml
          test -f robots.txt

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys, xml.etree.ElementTree as ET

          root = Path('.')
          errors = []
          html_files = sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)
          paths = set('/' if p.relative_to(root).as_posix() == 'index.html' else '/' + p.relative_to(root).as_posix() for p in html_files)
          paths.update('/' + p.relative_to(root).as_posix()[:-10].strip('/') + '/' for p in html_files if p.name == 'index.html' and p.relative_to(root).as_posix() != 'index.html')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.title=''; self.in_title=False; self.buf=[]
                  self.meta={}; self.canon=[]; self.hreflang=[]; self.links=[]; self.schema=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs); rel=a.get('rel','').lower()
                  if tag=='title': self.in_title=True; self.buf=[]
                  if tag=='meta' and a.get('name','').lower() in ('description','robots','keywords'):
                      self.meta[a.get('name','').lower()]=a.get('content','') or ''
                  if tag=='link' and rel=='canonical': self.canon.append(a.get('href',''))
                  if tag=='link' and rel=='alternate' and a.get('hreflang'): self.hreflang.append((a['hreflang'],a.get('href','')))
                  if tag=='script' and a.get('type')=='application/ld+json': self.schema=True
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag in ('script','link') and a.get('src' if tag=='script' else 'href'):
                      self.links.append(a.get('src' if tag=='script' else 'href'))
              def handle_endtag(self, tag):
                  if tag=='title': self.title=''.join(self.buf).strip(); self.in_title=False
              def handle_data(self,data):
                  if self.in_title: self.buf.append(data)

          for page in html_files:
              label=str(page); p=P(); p.feed(page.read_text(encoding='utf-8'))
              if page.name=='404.html': continue
              if not p.title: errors.append(f'{label}: missing title')
              if not (50 <= len(p.meta.get('description','')) <= 160): errors.append(f'{label}: meta description must be 50-160 characters')
              if 'noindex' in p.meta.get('robots','').lower(): errors.append(f'{label}: robots contains noindex')
              if 'index' not in p.meta.get('robots','').lower() or 'follow' not in p.meta.get('robots','').lower(): errors.append(f'{label}: robots must allow index,follow')
              if len(p.canon)!=1 or not p.canon[0].startswith('https://mrecipes.online/'): errors.append(f'{label}: invalid canonical')
              if page.parent.name=='recipes' and page.name!='recipe-template.html' and not p.schema: errors.append(f'{label}: missing JSON-LD Recipe schema')
              for href in p.links:
                  if not href or href.startswith(('#','mailto:','tel:','javascript:','data:','http://','https://','//')): continue
                  clean=urlparse(href).path.split('?',1)[0].split('#',1)[0]
                  if clean.startswith('/'):
                      target = root / clean.lstrip('/')
                  else:
                      target = (page.parent / clean).resolve()
                  if target.is_dir(): target = target / 'index.html'
                  if not target.is_file(): errors.append(f'{label}: broken local link/asset {href}')

          try:
              tree=ET.parse(root/'sitemap.xml'); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              sitemap_paths=[]
              for loc in tree.findall('.//s:loc',ns):
                  url=(loc.text or '').strip(); u=urlparse(url)
                  if u.scheme!='https' or u.netloc!='mrecipes.online': errors.append(f'sitemap: invalid domain {url}'); continue
                  sitemap_paths.append(u.path)
                  target=root / u.path.lstrip('/') if u.path not in ('','/') else root/'index.html'
                  if u.path.endswith('/'): target=target/'index.html'
                  if not target.is_file(): errors.append(f'sitemap: missing target {url}')
              if len(sitemap_paths) != len(set(sitemap_paths)): errors.append('sitemap: duplicate URLs')
          except Exception as exc: errors.append(f'sitemap parse error: {exc}')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors)); sys.exit(1)
          print(f'Validation passed: {len(html_files)} HTML files, metadata, hreflang, robots, JSON-LD, local links and sitemap.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
