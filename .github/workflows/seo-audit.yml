name: SEO preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Audit the same generated metadata state used by the production Pages build.
      - name: Build SEO metadata and validate locale inventory
        run: |
          python scripts/seo-build-v2.py
          python scripts/seo-description-fix.py
          python scripts/validate-i18n.py
          python scripts/apply-author-attribution.py
      - name: Run static SEO audit
        run: python scripts/seo_audit.py
