name: Generate responsive recipe images

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/recipes/*.webp'
      - 'scripts/generate-responsive-images.mjs'
      - '.github/workflows/generate-responsive-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install image tooling
        run: npm install --no-save sharp

      - name: Generate WebP and AVIF variants
        run: node scripts/generate-responsive-images.mjs

      - name: Commit generated variants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/recipes/*-480.webp assets/images/recipes/*-768.webp assets/images/recipes/*-1200.webp assets/images/recipes/*-480.avif assets/images/recipes/*-768.avif assets/images/recipes/*-1200.avif
          if git diff --cached --quiet; then
            echo 'No new responsive image variants.'
          else
            git commit -m 'Generate responsive WebP and AVIF recipe images'
            git push
          fi
