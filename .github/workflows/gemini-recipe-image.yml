name: Generate one recipe image (Hugging Face)

on:
  workflow_dispatch:
    inputs:
      recipe_slug:
        description: "One recipe slug only (pilot default: classic-pancakes)"
        required: true
        default: "classic-pancakes"
        type: string
      force_regenerate:
        description: "Replace an existing generated image (uses Hugging Face monthly credits; generation may fail when free credits are exhausted)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gemini-recipe-image-pilot
  cancel-in-progress: false

jobs:
  generate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated image-generation branch
        uses: actions/checkout@v4
        with:
          # Always generate on the feature branch, even when Run workflow is
          # launched from main. Never commit generated assets directly to main.
          ref: feat/gemini-recipe-image-pilot
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugging Face image SDK
        run: python -m pip install --upgrade huggingface_hub Pillow
      - name: Generate and validate exactly one image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RECIPE_SLUG: ${{ inputs.recipe_slug }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
        run: python scripts/generate_recipe_image.py
      - name: Commit generated image and page reference
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes to commit (the image may already exist)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/images/recipes/" "recipes/"
          git commit -m "Generate recipe image for ${{ inputs.recipe_slug }}"
          git push origin "HEAD:feat/gemini-recipe-image-pilot"
