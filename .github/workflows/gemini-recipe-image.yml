name: Generate one recipe image (Cloudflare Workers AI)

on:
  workflow_dispatch:
    inputs:
      recipe_slug:
        description: "One recipe slug only (pilot default: classic-pancakes)"
        required: true
        default: "classic-pancakes"
        type: string
      force_regenerate:
        description: "Replace an existing generated image (uses Cloudflare Workers AI free daily allocation, if available)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cloudflare-recipe-image-pilot
  cancel-in-progress: false

jobs:
  generate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated image-generation branch
        uses: actions/checkout@v4
        with:
          # Keep generated images isolated from main until reviewed.
          ref: feat/cloudflare-free-recipe-images
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate exactly one image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
          RECIPE_SLUG: ${{ inputs.recipe_slug }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
        run: python scripts/generate_recipe_image.py
      - name: Commit generated image and page reference
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes to commit (the image may already exist)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/images/recipes/" "recipes/"
          git commit -m "Generate recipe image for ${{ inputs.recipe_slug }}"
          git push origin "HEAD:feat/cloudflare-free-recipe-images"
